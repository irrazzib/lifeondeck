name: Deploy Client
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        working-directory: client
        run: |
          flutter pub get
          flutter build web --base-href "/lifeondeck/" --dart-define=API_BASE_URL=/lifeondeck/api/v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: client
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/irrazzib/lifeondeck-client:latest
            ghcr.io/irrazzib/lifeondeck-client:${{ github.sha }}

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/lifeondeck-client
            docker compose pull client
            docker compose up -d client
            docker image prune -f