name: Deploy Client
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/web-build-tools/package-lock.json

      - name: Install workbox-cli
        working-directory: client/web-build-tools
        run: npm ci

      # build-web.sh owns the two-phase PWA build (flutter --pwa-strategy=none,
      # then workbox generateSW). Do not inline `flutter build web` here: it would
      # emit flutter_service_worker.js while web/index.html registers sw.js.
      - name: Build web (PWA)
        working-directory: client
        run: |
          flutter pub get
          ./build-web.sh /api/v1 /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: client
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/irrazzib/lifeondeck-client:latest
            ghcr.io/irrazzib/lifeondeck-client:${{ github.sha }}

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/lifeondeck-client
            docker compose pull client
            docker compose up -d client
            docker image prune -f