server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # App shell + SW must never be served stale, otherwise a deploy is only
    # picked up once the browser cache expires. See DEPLOY_NOTES.md.
    location = /index.html      { add_header Cache-Control "no-cache" always; }
    location = /sw.js           { add_header Cache-Control "no-cache" always; }
    location = /manifest.json   { add_header Cache-Control "no-cache" always; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache" always; }

    # Content-hashed / immutable assets.
    location ~ ^/workbox-.*\.js$ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /canvaskit/        { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /icons/            { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # Not content-hashed by Flutter — short TTL, sw.js precache revisions handle
    # invalidation client-side.
    location = /main.dart.js    { add_header Cache-Control "public, max-age=3600" always; }
    location /assets/           { add_header Cache-Control "public, max-age=3600" always; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
